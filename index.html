  const year = Number(document.getElementById('tl-year').value) || new Date(today()).getFullYear();
  const ferkelLedger = computeFerkelTierliste(year);
  const d = computeTierliste(year);
  const v = computeVerkaufsstatistik(year);
  const el = document.getElementById('tierlisteResults');
  const f2 = n => n==null ? '–' : n.toFixed(2);

  let sauenSectionHtml;
  if(year < SAUEN_ERFASSUNG_START_JAHR){
    sauenSectionHtml = `
      <div class="stat-section">
        <h3>Formblatt ${year} – Zuchtschweine (Sauen)</h3>
        <div class="stat-note">Zuchtsauen wurden erst ab ${SAUEN_ERFASSUNG_START_JAHR} separat als eigene Tierkategorie erfasst – für ${year} liegt daher kein eigenes Formblatt vor.</div>
      </div>
    `;
  } else {
    const sauenLedger = computeSauenTierliste(year);
    sauenSectionHtml = (!sauenHistImportiert() ? `
      <div class="stat-section">
        <button class="btn-secondary" id="importSauenHistBtn">Historische Zuchtsauen-Daten (2015–2025) importieren</button>
      </div>
    ` : '') + renderLedgerSection(`Formblatt ${year} – Zuchtschweine (Sauen)`, sauenLedger, [
      { key:'verkauft', label:'Verkauf' }, { key:'verendet', label:'Verendung' }, { key:'korrektur', label:'Korrektur (Jahresübergang)' }
    ]) + (sauenLedger.totals.korrektur ? `<div class="stat-note" style="margin-top:-14px; margin-bottom:20px;">„Korrektur (Jahresübergang)" gleicht eine Differenz zwischen dem rechnerisch fortgeschriebenen und dem im Ursprungs-Formblatt händisch erfassten Anfangsbestand des Folgejahres aus (Stichtags-Nachzählung).</div>` : '');
  }

  el.innerHTML = `
    <div class="print-only">Tierliste ${year} – Jahresdurchschnittsbestand Zuchtschweine, Ferkel und Mastschweine</div>

    ${sauenSectionHtml}

    ${renderLedgerSection(`Formblatt ${year} – Ferkel`, ferkelLedger, [
      { key:'verkauft', label:'Verkauf' }, { key:'verendet', label:'Verendung' }, { key:'mast', label:'Umstallung Mast' }
    ])}

    <div class="stat-section">
      <h3>Formblatt ${year} – Ermittlung des Jahresdurchschnittbestandes (Mastschweine)</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-value">${d.anfangsbestand}</div><div class="stat-label">Anfangsbestand 1. Jänner</div></div>
        <div class="stat-card"><div class="stat-value">${d.jahresdurchschnitt.toFixed(2)}</div><div class="stat-label">Jahresdurchschnittsbestand</div></div>
      </div>
    </div>
    <div class="stats-table-wrap"><table class="stats-table">
      <thead><tr><th>Woche</th><th>Zugang</th><th>Verkauf</th><th>Verendung</th><th>Bestand</th></tr></thead>
      <tbody>
        ${d.weeks.map(w=>`<tr>
          <td>${w.week}</td><td>${w.zugang || ''}</td><td>${w.verkauft || ''}</td><td>${w.verendung || ''}</td><td><b>${w.bestand}</b></td>
        </tr>`).join('')}
        <tr>
          <td><b>Summe</b></td><td><b>${d.totalZugang}</b></td><td><b>${d.totalVerkauft}</b></td><td><b>${d.totalVerendung}</b></td><td><b>${d.sumBestand}</b></td>
        </tr>
      </tbody>
    </table></div>
    <div class="stat-note" style="margin:8px 0 20px;">Jahresdurchschnittsbestand = Summe der Wochenbestände (${d.sumBestand}) / 52 = <b>${d.jahresdurchschnitt.toFixed(2)}</b></div>

    <div class="stat-section">
      <h3>Ferkel – Jahresübersicht ${year}</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-value">${d.ferkelVK}</div><div class="stat-label">Ferkel verkauft</div></div>
        <div class="stat-card"><div class="stat-value">${d.ferkelEig}</div><div class="stat-label">Ferkel Eigenbedarf (in Mast)</div></div>
        <div class="stat-card"><div class="stat-value">${d.gesFerkel}</div><div class="stat-label">Ges. Ferkel</div></div>
      </div>
      <div class="stat-note">Verendung entspricht den bei den Mastschweinen eingetragenen Verlusten. Die detaillierte Verkaufsstatistik (Preise, Mfa%, Gewicht) findest du im Reiter „Verkauf".</div>
    </div>
  `;

  const importBtn = document.getElementById('importSauenHistBtn');
  if(importBtn) importBtn.addEventListener('click', importHistorischeSauenkorrekturen);
}

document.getElementById('tl-year').addEventListener('change', renderTierliste);
document.getElementById('printTierlisteBtn').addEventListener('click', ()=> window.print());

function initVerkaufYear(){
  const el = document.getElementById('vk-year');
  if(!el.value) el.value = new Date(today()).getFullYear();
}

function openVerkaufEditModal(g, idx){
  const s = g.sales[idx];
  modalBox.innerHTML = `
    <h3>Verkaufseintrag bearbeiten</h3>
    <div class="stat-note" style="margin-bottom:10px;">Herkunft: ${g.sowName}${g.ventil ? ` (V${g.ventil}/${g.bucht})` : ''}</div>
    <div class="field-row">
      <div class="field"><label>Datum</label><input type="date" id="ve-date" value="${s.date||''}"></div>
      <div class="field"><label>Stück</label><input type="number" min="1" id="ve-count" value="${s.count??''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Basispreis (€/kg)</label><input type="number" step="0.01" id="ve-basispreis" value="${s.basispreis??''}"></div>
      <div class="field"><label>Mfa %</label><input type="number" step="0.01" id="ve-mfa" value="${s.mfa??''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Ø Gewicht (kg)</label><input type="number" step="0.1" id="ve-gewicht" value="${s.gewicht??''}"></div>
      <div class="field"><label>Ama-Gütesiegel Stück</label><input type="number" min="0" id="ve-ama" value="${s.amaCount??''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Gesamtpreis (€)</label><input type="number" step="0.01" id="ve-gesamtpreis" value="${s.gesamtpreis??''}"></div>
      <div class="field"><label>Euro / KG</label><input type="number" step="0.01" id="ve-eurokg" value="${s.euroKg??''}"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-primary" id="ve-save">Speichern</button>
      <button class="btn-secondary" id="ve-cancel">Abbrechen</button>
    </div>
  `;
  document.getElementById('ve-cancel').onclick = closeModal;
  document.getElementById('ve-save').onclick = async ()=>{
    const date = document.getElementById('ve-date').value;
    const count = Number(document.getElementById('ve-count').value || 0);
    if(!date || count<=0){ showToast('Bitte Datum und Stück angeben'); return; }
    const numOrNull = id => { const v = document.getElementById(id).value; return v===''? null : Number(v); };
    g.sales[idx] = {
      ...s, date, count,
      basispreis: numOrNull('ve-basispreis'),
      mfa: numOrNull('ve-mfa'),
      gewicht: numOrNull('ve-gewicht'),
      amaCount: numOrNull('ve-ama'),
      gesamtpreis: numOrNull('ve-gesamtpreis'),
      euroKg: numOrNull('ve-eurokg')
    };
    await persistMastGruppe(g);
    closeModal(); renderVerkaufView(); showToast('Eintrag aktualisiert');
  };
  overlay.classList.add('open');
}

function renderVerkaufView(){
  const year = Number(document.getElementById('vk-year').value) || new Date(today()).getFullYear();
  const v = computeVerkaufsstatistik(year);
  const el = document.getElementById('verkaufResults');
  const f2 = n => n==null ? '–' : n.toFixed(2);

  const rowsHtml = v.sales.map((s,i)=>{
    let herkunft;
    if(s.breakdown && s.breakdown.length){
      herkunft = s.breakdown.map(b=>{
        const og = mastGruppen.find(g=>g.ventil===b.ventil && g.bucht===b.bucht);
        const rem = og ? mastGruppeStats(og).remaining : null;
        return `V${b.ventil}/${b.bucht}: ${b.count}${rem!=null ? ' (Best.: '+rem+')' : ''}`;
      }).join(', ');
    } else {
      herkunft = s.sowName;
      if(s.ventil){
        const originGroup = mastGruppen.find(g=>g.ventil===s.ventil && g.bucht===s.bucht);
        const originRemaining = originGroup ? mastGruppeStats(originGroup).remaining : null;
        herkunft += ` (V${s.ventil}/${s.bucht}${originRemaining!=null ? ', Bestand: '+originRemaining : ''})`;
      }
    }
    return `<tr>
    <td>${i+1}</td>
    <td>${fmt(s.date)}</td>
    <td>${s.woche}</td>
    <td>${f2(s.basispreis)}</td>
    <td>${f2(s.mfa)}</td>
    <td>${f2(s.gewicht)}</td>
    <td>${s.count}</td>
    <td>${s.amaCount ?? '–'}</td>
    <td>${s.gesamtpreis!=null ? f2(s.gesamtpreis)+' €' : '–'}</td>
    <td>${s.pStueck!=null ? f2(s.pStueck)+' €' : '–'}</td>
    <td>${s.euroKg!=null ? f2(s.euroKg)+' €' : '–'}</td>
    <td>${herkunft}</td>
    <td style="white-space:nowrap;">
      <button class="btn-secondary" data-act="vk-edit" data-gid="${s._groupId}" data-idx="${s._idx}" style="padding:4px 8px;font-size:0.74rem;">✎</button>
      <button class="btn-secondary" data-act="vk-delete" data-gid="${s._groupId}" data-idx="${s._idx}" style="padding:4px 8px;font-size:0.74rem;color:var(--alert);">✕</button>
    </td>
  </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="print-only">Verkaufsliste Mastschweine ${year}</div>
    <div class="stat-section">
      <h3>Mastschweine-Verkauf ${year}</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-value">${v.stueck}</div><div class="stat-label">Stück verkauft</div></div>
        <div class="stat-card"><div class="stat-value">${f2(v.basispreisAvg)}</div><div class="stat-label">Ø Basispreis (€/kg)</div></div>
        <div class="stat-card"><div class="stat-value">${f2(v.mfaAvg)}</div><div class="stat-label">Ø Mfa %</div></div>
        <div class="stat-card"><div class="stat-value">${f2(v.gewichtAvg)}</div><div class="stat-label">Ø Gewicht (kg)</div></div>
        <div class="stat-card"><div class="stat-value">${v.amaStueck}</div><div class="stat-label">Ama-Gütesiegel Stück</div></div>
        <div class="stat-card"><div class="stat-value">${f2(v.amaAnteil)}%</div><div class="stat-label">Ama-Anteil</div></div>
        <div class="stat-card"><div class="stat-value">${f2(v.durchschnPreis)}</div><div class="stat-label">Ø Preis / Stück (€)</div></div>
        <div class="stat-card"><div class="stat-value">${f2(v.gesamtpreis)}</div><div class="stat-label">Gesamterlös (€)</div></div>
      </div>
    </div>

    <div class="panel open" style="margin-bottom:16px;">
      <h2>Neuen Verkauf eintragen</h2>
      <div class="field-row">
        <div class="field"><label>Datum</label><input type="date" id="vkn-date" value="${today()}"></div>
        <div class="field"><label>Stück</label><input type="number" min="1" id="vkn-count"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Basispreis (€/kg)</label><input type="number" step="0.01" id="vkn-basispreis"></div>
        <div class="field"><label>Mfa %</label><input type="number" step="0.01" id="vkn-mfa"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Ø Gewicht (kg)</label><input type="number" step="0.1" id="vkn-gewicht"></div>
        <div class="field"><label>Ama-Gütesiegel Stück</label><input type="number" min="0" id="vkn-ama"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Gesamtpreis (€)</label><input type="number" step="0.01" id="vkn-gesamtpreis"></div>
        <div class="field"><label>Euro / KG (optional)</label><input type="number" step="0.01" id="vkn-eurokg"></div>
      </div>

      <div class="panelbtns">
        <button class="btn-primary" id="vkn-save">Verkauf speichern</button>
      </div>
    </div>

    <div class="stats-table-wrap"><table class="stats-table">
      <thead><tr>
        <th>Nr</th><th>Datum</th><th>Woche</th><th>Basispreis</th><th>Mfa%</th><th>Gewicht</th><th>Stück</th><th>Ama St.</th><th>Gesamtpreis</th><th>P/Stück</th><th>Euro KG</th><th>Bucht / Herkunft</th><th></th>
      </tr></thead>
      <tbody>
        ${rowsHtml}
        ${v.sales.length ? `<tr>
          <td colspan="3"><b>Summe / Ø</b></td>
          <td><b>${f2(v.basispreisAvg)}</b></td>
          <td><b>${f2(v.mfaAvg)}</b></td>
          <td><b>${f2(v.gewichtAvg)}</b></td>
          <td><b>${v.stueck}</b></td>
          <td><b>${v.amaStueck}</b></td>
          <td><b>${f2(v.gesamtpreis)} €</b></td>
          <td><b>${f2(v.durchschnPreis)} €</b></td>
          <td><b>${v.euroKgAvg!=null ? f2(v.euroKgAvg)+' €' : '–'}</b></td>
          <td></td>
          <td></td>
        </tr>` : ''}
      </tbody>
    </table></div>
    <div class="stat-note" style="margin-top:8px;">Ø-Werte je Lieferung berechnet (nicht nach Stückzahl gewichtet).</div>
  `;
}

document.getElementById('vk-year').addEventListener('change', renderVerkaufView);
document.getElementById('printVerkaufBtn').addEventListener('click', ()=> window.print());

document.getElementById('verkaufResults').addEventListener('click', async (e)=>{
  const editBtn = e.target.closest('button[data-act="vk-edit"]');
  const delBtn = e.target.closest('button[data-act="vk-delete"]');
  if(editBtn){
    const g = mastGruppen.find(x=>x.id===editBtn.dataset.gid);
    if(!g){ showToast('Eintrag nicht gefunden'); return; }
    openVerkaufEditModal(g, Number(editBtn.dataset.idx));
    return;
  }
  if(delBtn){
    const g = mastGruppen.find(x=>x.id===delBtn.dataset.gid);
    if(!g){ showToast('Eintrag nicht gefunden'); return; }
    if(confirm('Diesen Verkaufseintrag wirklich löschen?')){
      g.sales.splice(Number(delBtn.dataset.idx), 1);
      await persistMastGruppe(g);
      renderVerkaufView();
      showToast('Eintrag gelöscht');
    }
    return;
  }

  const btn = e.target.closest('#vkn-save');
  if(!btn) return;

  const date = document.getElementById('vkn-date').value;
  const count = Number(document.getElementById('vkn-count').value || 0);
  if(!date || count<=0){ showToast('Bitte Datum und Stück angeben'); return; }

  const numOrNull = id => { const v = document.getElementById(id).value; return v===''? null : Number(v); };
  let sammel = mastGruppen.find(x=>x.id==='mg_sammel');
  if(!sammel){
    sammel = { id:'mg_sammel', sowName:'Verkauf', originFerkelId:null, zugaenge:[], ventil:null, bucht:null, losses:[], sales:[] };
    mastGruppen.push(sammel);
  }
  sammel.sales = sammel.sales || [];
  sammel.sales.push({
    date, count,
    basispreis: numOrNull('vkn-basispreis'),
    mfa: numOrNull('vkn-mfa'),
    gewicht: numOrNull('vkn-gewicht'),
    amaCount: numOrNull('vkn-ama'),
    gesamtpreis: numOrNull('vkn-gesamtpreis'),
    euroKg: numOrNull('vkn-eurokg')
  });

  await persistMastGruppe(sammel);
  renderVerkaufView();
  showToast('Verkauf eingetragen');
});

loadAll();
setInterval(loadAll, 20000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadAll(); });
</script>
</body>
